# 통합 테스트 환경 설정 파일 (application-test.yml)

spring:
  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true  # 테스트 시 SQL 로그를 확인하기 위해 true로 설정
    properties:
      hibernate:
        format_sql: true

# 커스텀 설정 더미 값 - 테스트 시 실제 API 호출 방지 위해 더미 URL 설정
external:
  account-api:
    url: http://localhost:8081/api/accounts

# 테스트 환경에서는 Eureka 클라이언트 비활성화 -> 테스트 시 Eureka 서버가 필요 없도록 설정
eureka:
  client:
    enabled: false